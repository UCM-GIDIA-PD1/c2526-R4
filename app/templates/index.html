<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamPredictor — Predicción de métricas de juegos</title>
    <meta name="description"
        content="SteamPredictor utiliza Machine Learning para predecir popularidad, precios y sentimiento de reseñas de juegos de Steam.">
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>

<body>

    <div id="hero-scroll-container">
        <canvas id="hero-canvas"></canvas>
        <div id="hero-blend-overlay"></div>
    </div>

    <img src="/static/img/logo.png" id="corner-logo" alt="Logo">

    <div class="bg-base" aria-hidden="true">
        <div class="bg-figures" id="bg-figures"></div>
    </div>
    <div id="hover-bg-a" class="hover-bg" aria-hidden="true"></div>
    <div id="hover-bg-b" class="hover-bg" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="bg-noise" id="bg-noise" aria-hidden="true"></div>

    <div id="hero-transition">
        <canvas id="hero-echo-canvas"></canvas>
    </div>

    <div class="app-container">

        <section id="view-home" class="view active">

            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon">SEARCH</span>
                    <input type="text" id="search-input" class="search-input" autocomplete="off">
                </div>
                <div id="search-dropdown" class="search-dropdown"></div>
            </div>

            <div id="game-grid" class="game-grid">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <aside class="sidebar-filters hidden">
                <div class="sidebar-filter-item" id="side-btn-sort" title="Ordenar por popularidad">
                    <span class="sidebar-icon-arrow">↓</span>
                    <span class="sidebar-text">POPULARIDAD</span>
                </div>
                <div class="sidebar-filter-item" id="side-btn-genre" title="Filtrar por género">
                    <span class="sidebar-icon">▤</span>
                    <span class="sidebar-text">GÉNEROS</span>
                    <div id="genre-dropdown" class="filter-dropdown"></div>
                </div>
                <div class="sidebar-filter-item" id="side-btn-price" title="Filtrar por precio">
                    <span class="sidebar-icon">€</span>
                    <span class="sidebar-text">PRECIO</span>
                    <div id="price-dropdown" class="filter-dropdown"></div>
                </div>
            </aside>

            <div id="scroll-sentinel" class="loading"
                style="display: none; padding: 2rem 0; width: 100%; justify-content: center;">
                <div class="spinner"></div>
            </div>

        </section>

        <section id="view-game" class="view">
            <button id="btn-back-home" class="back-btn">
                ← Volver
            </button>
            <div id="game-detail-content">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </section>

        <section id="view-custom-game" class="view">
            <button id="btn-back-home-custom" class="back-btn">
                ← Volver
            </button>
            <div id="custom-game-detail-content">
                <!-- El contenido se inyectará dinámicamente o se puede dejar estático aquí -->
            </div>
        </section>

        <section id="view-prediction" class="view">
            <button id="btn-back-game" class="back-btn">
                ← Volver al juego
            </button>
            <div id="prediction-detail-content">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </section>

    </div>

    <div id="scroll-indicator" class="scroll-indicator">
        <div class="scroll-arrow-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 9L12 16L19 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>
    <script src="/static/js/app.js"></script>

</body>

</html>
